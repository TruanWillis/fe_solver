[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fe_solver"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7.1",
    "numpy>=1.24.2",
    "pandas>=1.5.3",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
